<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>三合一视频下载器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <header><div class="logo">▶</div><div><div class="brand">VIDEODROP</div><div class="sub">PUBLIC VIDEO DOWNLOADER</div></div><span class="pill">三平台</span></header>
  <section class="hero">
    <div class="eyebrow">TIKTOK · INSTAGRAM · FACEBOOK</div>
    <h1>好视频，<span>一贴即下。</span></h1>
    <p>粘贴公开视频链接，自动识别平台并获取可用下载格式。</p>
  </section>
  <section class="panel">
    <label for="url">视频链接</label>
    <div class="inputrow"><input id="url" type="url" placeholder="粘贴 TikTok / Instagram / Facebook 链接" autocomplete="url"><button id="paste" class="paste">粘贴</button></div>
    <button id="resolve" class="primary">解析视频 <span>→</span></button>
    <div class="platforms"><span>● TikTok</span><span>● Instagram</span><span>● Facebook</span></div>
  </section>
  <section id="status" class="status" aria-live="polite"></section>
  <section id="result" class="result hidden">
    <div class="videohead"><img id="thumb" alt=""><div><div id="platform" class="tag"></div><h2 id="title"></h2><small id="duration"></small></div></div>
    <label for="formats">选择下载格式</label><select id="formats"></select>
    <button id="download" class="primary">下载视频 <span>↓</span></button>
    <ul class="sourceinfo" id="sourceInfo"></ul><p class="hint" id="note"></p>
  </section>
  <footer><p>仅用于下载你拥有权利或已获授权的公开内容。请遵守各平台条款及当地法律。</p><p>不支持私密内容、绕过登录、付费墙或访问控制。</p></footer>
</main>
<script src="/static/app.js"></script>
</body></html>
